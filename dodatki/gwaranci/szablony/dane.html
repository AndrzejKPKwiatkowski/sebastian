{% extends "base.html" %}{% block body %}
<div class="narrow card" style="padding:28px">
  <h1>Cześć {{ me.imie_nazwisko.split()[0] }}! 👋</h1>
  <p class="muted">Na ten adres będą przychodzić zaproszenia do kalendarza. Najlepiej podaj adres, którego używasz z Kalendarzem Google.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>E-mail</label><input name="email" type="email" required value="{{ me.email }}" autocomplete="email">
    <label>Telefon (opcjonalnie — widzi go tylko druga osoba spotkania)</label><input name="telefon" value="{{ me.telefon }}" autocomplete="tel">
    <p style="margin-top:16px"><button class="btn">Dalej</button></p>
  </form>
</div>{% endblock %}
