{% extends "base.html" %}
{% block content %}
<div class="card center" style="padding:36px 24px;max-width:520px;margin:30px auto">
  <img src="{{ url_for('owca_art', name=art) }}" alt="Owca Sebastian" width="140" height="140">
  <h1 style="margin:14px 0 8px">{{ title }}</h1>
  <p class="soft">{{ text }}</p>
  {% if extra %}<p style="margin-top:18px"><a class="btn big" href="{{ extra }}">{{ 'Tak, przyjmuję' if 'tak=1' in extra else 'Przejrzyj aplikacje' }}</a></p>{% endif %}
</div>
{% endblock %}
